[project]
name = "placapro"
version = "0.1.0"
description = "Optimizador de cortes de placas de melamina/madera para fabricación de muebles"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: tests lentos (benchmarks)",
    "ui: tests de interfaz gráfica (requieren Qt)",
]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
